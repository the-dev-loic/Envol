<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Envol</title>
  <meta name="theme-color" content="#bfe3f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Envol">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <span id="dist">0 m</span>
    <span id="speed">0 km/h</span>
  </div>

  <div id="menu" class="screen">
    <h1>Envol</h1>
    <p>Incline ton téléphone pour éviter les arbres.</p>
    <p class="cta">Touche pour t'envoler</p>
    <p id="best" class="small"></p>
    <p id="hint" class="small"></p>
    <p class="small install">Astuce : Partager › « Sur l'écran d'accueil » pour le plein écran.</p>
  </div>

  <div id="over" class="screen" hidden>
    <h2>Collision !</h2>
    <p id="final" class="big"></p>
    <p id="record"></p>
    <p class="cta">Touche pour rejouer</p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
